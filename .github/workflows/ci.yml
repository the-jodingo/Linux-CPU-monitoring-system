name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: .

  smoke:
    name: Smoke test (script starts and exits cleanly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n cpu-monitor.sh

      - name: Run for 5s
        run: |
          chmod +x cpu-monitor.sh
          timeout 5 ./cpu-monitor.sh || [ $? -eq 124 ]
